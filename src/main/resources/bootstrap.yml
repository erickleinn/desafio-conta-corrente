spring:
  config:
    activate:
      on-profile: localstack
  application:
    name: desafio-saldo
  datasource:
    url: jdbc:postgresql://localhost:5432/conta_corrente_db
    username: test
    password: test
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

cloud:
  aws:
    region:
      auto: false
      static: sa-east-1
      use-default-aws-region-chain: true
    stack: false
    stack.auto: false
    sqs:
      endpoint: http://localhost:4566

logging:
  level:
    com:
      amazonaws:
        internal:
          InstanceMetadataServiceResourceFetcher: error
        util:
          EC2MetadataUtils: error

message:
  sqs:
    transacoes: "transacoes-financeiras-processadas"